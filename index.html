sec.querySelectorAll('[data-prop]').forEach(el=>el.addEventListener('input',()=>{s[el.dataset.prop]=el.innerText;mark()}));

card.querySelectorAll('[data-act]').forEach(b=>b.addEventListener('click',()=>{if(!admin)return;let a=b.dataset.act;if(a==='replace')pickPhotos(s,pi);if(a==='remove'){s.photos.splice(pi,1);render();mark()}if(a==='left'&&pi>0){[s.photos[pi-1],s.photos[pi]]=[s.photos[pi],s.photos[pi-1]];render();mark()}if(a==='right'&&pi<s.photos.length-1){[s.photos[pi+1],s.photos[pi]]=[s.photos[pi],s.photos[pi+1]];render();mark()}}));grid.append(card)});root.append(sec)})}
async function compress(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{try{const scale=Math.min(1,1800/img.width,1800/img.height);const c=document.createElement('canvas');c.width=Math.max(1,Math.round(img.width*scale));c.height=Math.max(1,Math.round(img.height*scale));c.getContext('2d').drawImage(img,0,0,c.width,c.height);c.toBlob(b=>{URL.revokeObjectURL(url);b?resolve(b):reject(new Error('이미지 변환 실패'))},'image/jpeg',.85)}catch(e){reject(e)}};img.onerror=()=>reject(new Error('이미지를 읽을 수 없습니다'));img.src=url})}
function pickPhotos(section,replaceIndex){if(!admin)return;const input=document.createElement('input');input.type='file';input.accept='image/*';input.multiple=replaceIndex===undefined;input.onchange=async()=>{try{for(const file of input.files){status('사진 업로드 중…');const blob=await compress(file);const path=`references/${uid()}.jpg`;const {error}=await client.storage.from('wedding-photos').upload(path,blob,{contentType:'image/jpeg',upsert:false});if(error)throw error;const {data}=client.storage.from('wedding-photos').getPublicUrl(path);const photo={id:uid(),src:data.publicUrl,caption:''};if(replaceIndex!==undefined){section.photos[replaceIndex]={...photo,caption:section.photos[replaceIndex].caption};break}else section.photos.push(photo)}render();mark();await persist()}catch(e){status('업로드 실패');alert('사진 업로드 실패: '+e.message)}};input.click()}
document.querySelectorAll('[data-field]').forEach(el=>el.addEventListener(el.matches('input')?'change':'input',()=>{if(!admin)return;state.fields[el.dataset.field]=el.matches('input')?el.value:el.innerText;mark()}));
$('#addSection').onclick=()=>{if(!admin)return;state.sections.push({id:uid(),title:String(state.sections.length+1).padStart(2,'0')+'. 새로운 촬영 시안',description:'원하는 촬영 분위기와 요청사항을 적어주세요.',photos:[]});render();mark()};
$('#viewBtn').onclick=()=>{preview=!preview;document.body.classList.toggle('preview',preview);document.querySelectorAll('.edit-only').forEach(e=>e.classList.toggle('hidden',preview));$('#viewBtn').textContent=preview?'편집으로 돌아가기':'미리보기';setEditable();render()};
$('#saveBtn').onclick=()=>{dirty=true;persist()};
$('#pdfBtn').onclick=()=>window.print();
$('#exportBtn').onclick=()=>{const a=document.createElement('a'),url=URL.createObjectURL(new Blob([JSON.stringify(state,null,2)],{type:'application/json'}));a.href=url;a.download='wedding-moodboard-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
$('#importBtn').onclick=()=>$('#importFile').click();
$('#importFile').onchange=async e=>{try{const obj=JSON.parse(await e.target.files[0].text());if(!Array.isArray(obj.sections)||!obj.fields||typeof obj.fields!=='object')throw Error();state=obj;ensureVariants();fill();mark()}catch{alert('올바른 백업 파일이 아닙니다.')}};
$('#loginBtn').onclick=async()=>{const email=$('#email').value.trim(),password=$('#password').value;if(!email||!password)return alert('이메일과 비밀번호를 입력하세요');status('로그인 중…');const {error}=await client.auth.signInWithPassword({email,password});if(error){status('로그인 실패');return alert(error.message)}await checkAdmin()};
$('#logoutBtn').onclick=async()=>{if(dirty)await persist();await client.auth.signOut();setAdmin(false);status('보기 전용');};
async function checkAdmin(){const {data:{user}}=await client.auth.getUser();if(!user){setAdmin(false);return}const {data,error}=await client.from('moodboard_admins').select('user_id').eq('user_id',user.id).maybeSingle();if(error||!data){await client.auth.signOut();setAdmin(false);alert('관리자로 등록되지 않은 계정입니다.');return}setAdmin(true);status('관리자 편집 모드')}
async function init(){if(!window.supabase||!window.SUPABASE_URL||!window.SUPABASE_ANON_KEY||window.SUPABASE_URL.includes('YOUR_')){status('설정 필요');alert('config.js에 Supabase URL과 공개 키를 입력해 주세요. README를 참고하세요.');fill();return}client=window.supabase.createClient(window.SUPABASE_URL,window.SUPABASE_ANON_KEY);await refresh();await checkAdmin();client.channel('moodboard-updates').on('postgres_changes',{event:'UPDATE',schema:'public',table:'moodboards',filter:'id=eq.main'},()=>{if(!admin&&!dirty)refresh()}).subscribe()}
window.addEventListener('beforeunload',e=>{if(dirty){e.preventDefault();e.returnValue=''}});

// Scale the whole page sheet uniformly on phones instead of reflowing its columns.
function syncDesktopLayoutOnMobile(){
  const sheet=document.getElementById('sheet');
  if(!sheet)return;
  if(window.matchMedia('screen and (max-width: 700px)').matches){
    const width=document.documentElement.clientWidth;
    const scale=Math.min(1,(width-16)/1120);
    sheet.style.zoom=String(scale);
    sheet.style.marginTop='16px';
    sheet.style.marginBottom='24px';
  }else{
    sheet.style.zoom='';
    sheet.style.marginTop='';
    sheet.style.marginBottom='';
  }
}
window.addEventListener('resize',syncDesktopLayoutOnMobile);
syncDesktopLayoutOnMobile();

init();
</script></body></html>
